services:
  - type: web
    name: antikamera-pro
    runtime: node
    plan: free
    buildCommand: "true"
    startCommand: node autosale/server.js
    envVars:
      - key: ADMIN_KEY
        generateValue: true
      - key: PRICE
        value: "9.9"
      - key: TRONGRID_KEY
        sync: false
      - key: PUBLIC_URL
        value: https://antikamera-pro.onrender.com
      - key: KEEP_AWAKE
        value: "1"
    healthCheckPath: /healthz
